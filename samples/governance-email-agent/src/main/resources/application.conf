akka.javasdk {

  dev-mode.http-port = 9774

  agent {
    # Other AI models can be configured, see https://doc.akka.io/sdk/model-provider-details.html
    # for the reference configurations. Triage classification is rule-based and needs no model;
    # only the reply/meeting agents call an LLM.
    model-provider = anthropic

    anthropic {
      model-name = "claude-sonnet-4-5"
      api-key = ${?ANTHROPIC_API_KEY}
      max-tokens = 5000
    }

    openai {
      model-name = "gpt-4o"
      api-key = ${?OPENAI_API_KEY}
    }

    googleai-gemini {
      model-name = "gemini-2.5-flash"
      api-key = ${?GOOGLE_AI_GEMINI_API_KEY}
    }

    # Triage is a V1 Classifier, invoked inline by the workflow through the ClassifierClient by name.
    # It is rule-based here, so it takes no model; the config section carries its keyword rules.
    classifiers {
      "triage-classifier" {
        class = "io.akka.samples.ambientemailassistant.application.TriageClassifier"
        meeting-keywords = ["meeting", "call", "schedule", "calendar", "availability", "sync"]
        urgent-keywords = ["urgent", "asap", "immediately", "critical", "emergency"]
      }
    }

    # G1 — before-tool-call guardrail. Blocks the outbound send/create tool on the action agents
    # unless the call is marked approved. The workflow sets that flag from the thread's APPROVED
    # status, so the entity status is the source of truth and the guardrail is the enforcement point.
    guardrails {
      "approval gate" {
        class = "io.akka.samples.ambientemailassistant.application.ApprovalToolGuardrail"
        agents = ["reply-dispatch-agent", "meeting-booking-agent"]
        category = POLICY
        use-for = ["before-tool-call"]
        report-only = false
      }
    }
  }

  # E1 — evaluator bound to the reply-draft agent. The runtime triggers it for each interaction;
  # it reads the interaction from the ledger and records an LLM-as-judge style quality score.
  evaluation.evaluators {
    draft-quality-evaluator {
      agents {
        reply-draft-agent { trigger = interaction }
      }
    }
  }
}
